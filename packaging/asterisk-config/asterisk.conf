; Kiestoon: Asterisk main configuration. Shipped by the kiestoon package, overwritten on upgrade.
[directories]
astetcdir => /etc/asterisk
astmoddir => /usr/lib/asterisk/modules
astvarlibdir => /var/lib/asterisk
astdbdir => /var/lib/asterisk
astkeydir => /var/lib/asterisk
astdatadir => /var/lib/asterisk
astagidir => /var/lib/asterisk/agi-bin
; Voicemail and other recordings live in the Kiestoon data directory, so backups include them.
astspooldir => /var/lib/kiestoon/asterisk/spool
astrundir => /run/asterisk
astlogdir => /var/log/asterisk
astsbindir => /usr/sbin

[options]
verbose = 2
debug = 0
runuser = asterisk
rungroup = asterisk
defaultlanguage = en
documentation_language = en_US
transmit_silence = yes
hideconnect = yes
