; Kiestoon: Channel Event Logging, sent as AMI events only (nothing is written to disk here).
; The portal stores these per call (by linkedid) to show the call journey in the call history,
; and removes them after the retention period set under Call features & fraud.
[general]
enable = yes
events = CHAN_START,ANSWER,HANGUP,BRIDGE_ENTER,BRIDGE_EXIT,PARK_START,BLINDTRANSFER,ATTENDEDTRANSFER,PICKUP,FORWARD,LINKEDID_END,USER_DEFINED

[manager]
enabled = yes
