# Builds the Kiestoon .deb. Used by `make deb` and the release workflow.
name: kiestoon
arch: ${ARCH}
platform: linux
version: ${VERSION}
version_schema: semver
section: comm
priority: optional
maintainer: RHIS <info@rhis.nl>
description: |
  Kiestoon open source VoIP phone system (PBX).
  Web portal, API and updater for a single-tenant phone system on Debian 13.
vendor: RHIS
homepage: https://github.com/rhisijmuiden/kiestoon
license: GPL-3.0-or-later

depends:
  - adduser
  - ca-certificates
  - curl
  - jq
  - zstd
  - kiestoon-asterisk (>= 22)
  - nftables
  - fail2ban
  - python3-systemd
  - restic
  - rclone
  # Fax-to-mail: converts received faxes (TIFF) to PDF.
  - libtiff-tools
  # Sending faxes: renders PDF documents as fax images (TIFF G3).
  - ghostscript
  # Direct internet access: Let's Encrypt certificates and HTTPS on 443 (off until switched on).
  - caddy

recommends:
  - kiestoon-sounds-nl
  # Local text-to-speech and speech-to-text (optional, about 200 MB).
  - kiestoon-speech

contents:
  - src: ./build/kiestoon
    dst: /usr/bin/kiestoon
    file_info: { mode: 0755 }
  - src: ./packaging/kiestoon-updater
    dst: /usr/lib/kiestoon/kiestoon-updater
    file_info: { mode: 0755 }
  - src: ./packaging/systemd/kiestoon.service
    dst: /usr/lib/systemd/system/kiestoon.service
  - src: ./packaging/systemd/kiestoon-helper.service
    dst: /usr/lib/systemd/system/kiestoon-helper.service
  - src: ./packaging/fix-permissions
    dst: /usr/lib/kiestoon/fix-permissions
    file_info: { mode: 0755 }
  - src: ./packaging/fail2ban/kiestoon-portal.conf
    dst: /etc/fail2ban/filter.d/kiestoon-portal.conf
  - src: ./packaging/logrotate-asterisk
    dst: /etc/logrotate.d/kiestoon-asterisk
  - src: ./packaging/asterisk-config/*.conf
    dst: /etc/asterisk/
  - src: ./packaging/systemd/asterisk.service.d/kiestoon.conf
    dst: /usr/lib/systemd/system/asterisk.service.d/kiestoon.conf
  - src: ./packaging/systemd/kiestoon-updater.path
    dst: /usr/lib/systemd/system/kiestoon-updater.path
  - src: ./packaging/systemd/kiestoon-updater.service
    dst: /usr/lib/systemd/system/kiestoon-updater.service
  - src: ./packaging/kiestoon.env
    dst: /etc/kiestoon/kiestoon.env
    type: config|noreplace
    file_info: { mode: 0640 }
  - src: ./packaging/profile.sh
    dst: /etc/profile.d/kiestoon.sh
    file_info: { mode: 0644 }

scripts:
  postinstall: ./packaging/scripts/postinstall.sh
  preremove: ./packaging/scripts/preremove.sh
  postremove: ./packaging/scripts/postremove.sh
