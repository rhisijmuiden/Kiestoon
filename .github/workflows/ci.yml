name: CI

on:
  pull_request:
  push:
    branches: [main, testing]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  asterisk:
    name: Asterisk package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Cache the package
        id: cache
        uses: actions/cache@v4
        with:
          path: dist-asterisk
          key: asterisk-amd64-${{ hashFiles('packaging/asterisk/**') }}
      - name: Build Asterisk in Debian 13
        if: steps.cache.outputs.cache-hit != 'true'
        run: docker run --rm -v "$PWD:/src" -w /src debian:trixie packaging/asterisk/build.sh dist-asterisk
      - name: Show package
        run: |
          sudo chown -R "$(id -u):$(id -g)" dist-asterisk
          dpkg-deb -I dist-asterisk/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: asterisk-amd64
          path: dist-asterisk/*.deb
          retention-days: 3

  sounds:
    name: Dutch voice prompts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Cache the package
        id: cache
        uses: actions/cache@v4
        with:
          path: dist-sounds
          key: sounds-nl-${{ hashFiles('packaging/sounds-nl/**') }}
      - name: Speak the prompts in Debian 13
        if: steps.cache.outputs.cache-hit != 'true'
        run: docker run --rm -v "$PWD:/src" -w /src debian:trixie packaging/sounds-nl/build.sh dist-sounds
      - name: Show package
        run: |
          sudo chown -R "$(id -u):$(id -g)" dist-sounds
          dpkg-deb -I dist-sounds/*.deb
          dpkg-deb -c dist-sounds/*.deb | grep -c '\.wav$'
      - uses: actions/upload-artifact@v4
        with:
          name: sounds-nl
          path: dist-sounds/*.deb
          retention-days: 3

  test:
    name: Test and build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Web UI (translations, type check, build)
        run: make web

      - name: Go vet and tests
        working-directory: server
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; echo "run gofmt"; exit 1; }
          go vet ./...
          go test -race ./...

      - name: Shell scripts
        run: |
          shellcheck -S warning install.sh lxc/build-lxc.sh packaging/kiestoon-updater packaging/fix-permissions \
            packaging/scripts/*.sh packaging/asterisk/*.sh packaging/ci/*.sh packaging/sounds-nl/*.sh

      - name: Debian package
        run: |
          GOTOOLCHAIN=auto go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.49.0
          make deb VERSION="v0.0.0-ci.${GITHUB_RUN_NUMBER}"
          dpkg-deb -I dist/*.deb
          dpkg-deb -c dist/*.deb

      - uses: actions/upload-artifact@v4
        with:
          name: kiestoon-amd64
          path: dist/*.deb
          retention-days: 3

  install:
    name: Install test (Debian 13)
    needs: [asterisk, sounds, test]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Install both packages and check the services
        run: packaging/ci/install-test.sh dist/kiestoon_*_amd64.deb dist/kiestoon-asterisk_*_amd64.deb dist/kiestoon-sounds-nl_*_all.deb
