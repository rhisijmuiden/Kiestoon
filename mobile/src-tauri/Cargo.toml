[package]
name = "kiestoon-mobile"
version = "0.0.0"
description = "Kiestoon mobile app"
authors = ["RHIS"]
license = "GPL-3.0-or-later"
repository = "https://github.com/rhisijmuiden/kiestoon"
edition = "2021"
rust-version = "1.80"

[lib]
name = "kiestoon_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"
tauri-plugin-kiestoon-call = { path = "../plugins/kiestoon-call" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json"] }
url = "2"
log = "0.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
