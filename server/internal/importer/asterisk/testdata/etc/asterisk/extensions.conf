[globals]

[internal]
include => phones
exten => 600,1,Dial(PJSIP/201&PJSIP/202,25)
 same => n,VoiceMail(201@default,u)
exten => 700,1,Queue(support)
exten => 800,1,Goto(ivr-main,s,1)
exten => _0X.,1,Dial(PJSIP/${EXTEN}@voys)

[phones]
exten => 201,1,Dial(PJSIP/201,20)
 same => n,VoiceMail(201@default,u)
exten => 202,1,Dial(PJSIP/202,20)
 same => n,VoiceMail(202@default,u)
exten => 203,1,Dial(PJSIP/203)

[from-trunk]
exten => +31201234567,1,Goto(daynight,s,1)
exten => 0201234568,1,Dial(PJSIP/202)
exten => _X.,1,Hangup()

[daynight]
exten => s,1,GotoIfTime(08:30-17:00,mon-fri,*,*?ivr-main,s,1)
 same => n,GotoIfTime(10:00-12:00,sat,*,*?ivr-main,s,1)
 same => n,Playback(custom/closed)
 same => n,VoiceMail(201@default,u)

[ivr-main]
exten => s,1,Answer()
 same => n,Background(custom/welcome)
 same => n,WaitExten(5)
exten => 1,1,Goto(internal,600,1)
exten => 2,1,Queue(support)
exten => 3,1,Dial(PJSIP/0612345678@voys)
exten => 9,1,Goto(ivr-main,s,1)
exten => t,1,Goto(phones,203,1)
exten => i,1,Playback(invalid)
 same => n,Goto(ivr-main,s,1)
