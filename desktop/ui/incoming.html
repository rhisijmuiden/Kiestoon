<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Kiestoon</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    html, body { background: var(--surface); overflow: hidden; }
    .toast { height: 100vh; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); padding: 12px 14px; display: flex; flex-direction: column; }
    .head { display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--muted); }
    .head img { width: 16px; height: 16px; }
    .who { display: flex; gap: 12px; align-items: center; margin-top: 8px; min-width: 0; }
    .av { width: 44px; height: 44px; flex: none; border-radius: 50%; display: grid; place-items: center; font-weight: 600; color: var(--onacc);
      background: linear-gradient(135deg, var(--accent), var(--accent2)); animation: pulse 1.6s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 45%, transparent); } 50% { box-shadow: 0 0 0 8px transparent; } }
    .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: auto; }
    .row button { height: 36px; border-radius: 10px; border: 0; color: #fff; font-weight: 600; }
  </style>
</head>
<body>
  <div class="toast">
    <div class="head"><img src="mark.png" alt="" /> <span>Kiestoon · <span data-t="incoming"></span></span></div>
    <div class="who">
      <div class="av" id="av"></div>
      <div style="min-width:0">
        <div class="name" id="name"></div>
        <div class="subtle" id="sub"></div>
      </div>
    </div>
    <div class="row">
      <button id="answer" type="button" style="background:#059669" data-t="answer"></button>
      <button id="decline" type="button" style="background:#DC2626" data-t="decline"></button>
    </div>
  </div>
  <script src="i18n.js"></script>
  <script src="incoming.js"></script>
</body>
</html>
