; Asterisk 20.5.0 example
[global]
type=global
user_agent=Asterisk PBX

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0

[phone](!)
type=endpoint
context=internal
disallow=all
allow=alaw,ulaw
transport=transport-udp

[auth-tpl](!)
type=auth
auth_type=userpass

[aor-tpl](!)
type=aor
max_contacts=2

[201](phone)
callerid="Anna de Vries" <201>
auth=201
aors=201
mailboxes=201@default
[201](auth-tpl)
password=Secr3tPass201
username=201
[201](aor-tpl)

[202](phone)
callerid="Bram Jansen" <202>
auth=202
aors=202
[202](auth-tpl)
password=Secr3tPass202
username=202
[202](aor-tpl)

[203](phone)
callerid="Receptie" <203>
auth=203
aors=203
