; Kiestoon: the Asterisk Manager Interface, only reachable from this machine.
[general]
enabled = yes
port = 5038
bindaddr = 127.0.0.1
displayconnects = no
timestampevents = yes
authtimeout = 10
authlimit = 10
; Channel variables in call events (the number that was called, for webhooks).
channelvars = KT_DID

#tryinclude "/var/lib/kiestoon/pbx/manager_users.conf"
