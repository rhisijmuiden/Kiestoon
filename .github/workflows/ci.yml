name: CI

on:
  pull_request:
  push:
    branches: [main, testing]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Web UI (translations, type check, build)
        run: make web

      - name: Go vet and tests
        working-directory: server
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; echo "run gofmt"; exit 1; }
          go vet ./...
          go test -race ./...

      - name: Shell scripts
        run: shellcheck -S warning install.sh lxc/build-lxc.sh packaging/kiestoon-updater packaging/scripts/*.sh

      - name: Debian package
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          make deb VERSION="v0.0.0-ci.${GITHUB_RUN_NUMBER}"
          dpkg-deb -I dist/*.deb
          dpkg-deb -c dist/*.deb

      - name: Install test
        run: |
          sudo apt-get install -y ./dist/*.deb
          sudo systemctl start kiestoon
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8080/api/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/api/setup/status | grep -q '"setupRequired":true'
          sudo kiestoon setup-token
          curl -fsS http://127.0.0.1:8080/ | grep -q '<div id="root">'
          systemctl is-enabled kiestoon-updater.path
